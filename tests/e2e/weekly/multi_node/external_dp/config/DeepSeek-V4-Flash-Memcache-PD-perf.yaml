# Memcache支持DeepSeek V4 Flash 双机PD分离性能测试
test_name: "DeepSeek-V4-Flash-Memcache-PD-perf"
model: "Eco-Tech/deepseekv4-flash-w8a8-mtp"
num_nodes: 2
npu_per_node: 16

env_common: &env_common
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  PYTHONHASHSEED: "0"
  MMC_LOCAL_CONFIG_PATH: "/mnt/share/j30080978/nightly/DeepSeek-V4-Flash-Memcache-PD-perf-conf/mmc-local.conf"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
  DISAGGREGATED_PREFILL_PROXY_SCRIPT: "examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py"

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [0]
    decoder: [1]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12331
    dp_size: 4
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12331
    dp_size: 16
    dp_size_local: 16
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"
 
 
templates:
  - node_index: 0
    envs:
      <<: *env_common
      HCCL_BUFFSIZE: "2560"
      LWS_WORKER_INDEX: "0"
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "16"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--model-loader-extra-config"
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - "--speculative-config"
      - '{"num_speculative_tokens": 1,"method": "mtp","enforce_eager": true}'
      - "--trust-remote-code"
      - "--block-size"
      - "32"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--quantization"
      - "ascend"
      - "--enforce-eager"
      - "--additional-config"
      - '{"enable_cpu_binding": true, "enable_shared_expert_dp": true, "enable_dsa_cp": true, "enable_flashcomm1":true}'
      - "--kv-transfer-config"
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"prefill": {"dp_size": 4, "tp_size": 4}, "decode": {"dp_size": 16, "tp_size": 1}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"backend": "memcache", "use_layerwise": true}}]}}'

  - node_index: 1 
    envs:
      <<: *env_common
      HCCL_BUFFSIZE: "1024"
      HCCL_CONNECT_TIMEOUT: "1200"
      VLLM_ASCEND_ENABLE_MLAPO: "1"
      LWS_WORKER_INDEX: "1"
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "120"
      - "--max-num-seqs"
      - "60"
      - "--block-size"
      - "32"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--no-enable-prefix-caching"
      - "--trust-remote-code"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--model-loader-extra-config"
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--quantization"
      - "ascend"
      - "--speculative-config"
      - '{"num_speculative_tokens": 1,"method": "mtp","enforce_eager": true}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false}, "enable_cpu_binding":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable":true}'
      - "--kv-transfer-config"
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_consumer", "kv_port": "30100", "kv_connector_extra_config": {"prefill": {"dp_size": 4, "tp_size": 4}, "decode": {"dp_size": 16, "tp_size": 1}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"backend": "memcache", "use_layerwise": true}}]}}'

benchmarks:
  perf:
    case_type: performance
    dataset_path: /mnt/share/j30080978/nightly/GSM8K_test
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 64
    max_out_len: 1500
    batch_size: 16
    request_rate: 0
    baseline: 1
    threshold: 0.97
