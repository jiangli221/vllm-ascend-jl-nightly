# GLM5.1叠加Memcache+layerwise，四机PD分离性能测试
test_name: "GLM-5.1-Memcache-Layerwise-PD-perf"
model: "/mnt/share/weights/glm-5.1-w8a8"
num_nodes: 4
npu_per_node: 16

env_common: &env_common
  VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  ASCEND_AGGREGATE_ENABLE: "1"
  ASCEND_TRANSPORT_PRINT: "1"
  ACL_OP_INIT_MODE: "1"
  ASCEND_A3_ENABLE: "1"
  VLLM_NIXL_ABORT_REQUEST_TIMEOUT: "300000"
  PYTHONHASHSEED: "0"
  SERVER_PORT: "DEFAULT_PORT"
  DISAGGREGATED_PREFILL_PROXY_SCRIPT: "examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py"

disaggregated_prefill:
  enabled: true
  prefiller_host_index: [0, 1]
  decoder_host_index: [2, 3]

deployment:
  - envs:
      <<: *env_common
      HCCL_BUFFSIZE: "256"
      MMC_LOCAL_CONFIG_PATH: "/home/x00953824/glm-memcache_p/config/mmc-local.conf"
      VLLM_PP_LAYER_PARTITION: "41,37"
    server_cmd: >
      vllm serve /mnt/share/weights/glm-5.1-w8a8
      --host 0.0.0.0
      --port $SERVER_PORT
      --data-parallel-size 1
      --tensor-parallel-size 16
      --enable-expert-parallel
      --pipeline-parallel-size 2
      --distributed-executor-backend mp
      --master-addr ${NODE_0_IP}
      --master-port 7600
      --nnodes 2
      --node-rank 0
      --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}'
      --speculative-config '{"num_speculative_tokens": 3, "method":"deepseek_mtp", "enforce_eager":true}'
      --seed 1024
      --max-model-len 131072
      --additional-config '{"enable_npugraph_ex": true, "fuse_muls_add":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable": true, "layer_sharding": ["q_b_proj", "o_proj"]}'
      --max-num-batched-tokens 16384
      --trust-remote-code
      --max-num-seqs 64
      --quantization ascend
      --gpu-memory-utilization 0.92
      --enforce-eager
      --enable-auto-tool-choice
      --tool-call-parser glm47
      --reasoning-parser glm45
      --kv-transfer-config '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_load_failure_policy": "recompute", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16, "pp_layer_partition": "41,37"}, "decode": {"dp_size": 8, "tp_size": 4}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"backend": "memcache", "use_layerwise": true}}]}}'
  - envs:
      <<: *env_common
      HCCL_BUFFSIZE: "256"
      MMC_LOCAL_CONFIG_PATH: "/home/x00953824/glm-memcache_p/config/mmc-local.conf"
      VLLM_PP_LAYER_PARTITION: "41,37"
    server_cmd: >
      vllm serve /mnt/share/weights/glm-5.1-w8a8
      --host 0.0.0.0
      --port $SERVER_PORT
      --data-parallel-size 1
      --tensor-parallel-size 16
      --enable-expert-parallel
      --pipeline-parallel-size 2
      --distributed-executor-backend mp
      --master-addr ${NODE_0_IP}
      --master-port 7600
      --nnodes 2
      --node-rank 1
      --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}'
      --speculative-config '{"num_speculative_tokens": 3, "method":"deepseek_mtp", "enforce_eager":true}'
      --seed 1024
      --max-model-len 131072
      --additional-config '{"enable_npugraph_ex": true, "fuse_muls_add":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable": true, "layer_sharding": ["q_b_proj", "o_proj"]}'
      --max-num-batched-tokens 16384
      --trust-remote-code
      --max-num-seqs 64
      --quantization ascend
      --gpu-memory-utilization 0.92
      --enforce-eager
      --enable-auto-tool-choice
      --tool-call-parser glm47
      --reasoning-parser glm45
      --kv-transfer-config '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_load_failure_policy": "recompute", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16, "pp_layer_partition": "41,37"}, "decode": {"dp_size": 8, "tp_size": 4}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"backend": "memcache", "use_layerwise": true}}]}}'
  - envs:
      <<: *env_common
      HCCL_BUFFSIZE: "900"
      TASK_QUEUE_ENABLE: "1"
      VLLM_ASCEND_ENABLE_MLAPO: "1"
      MMC_LOCAL_CONFIG_PATH: "/home/x00953824/glm-memcache_d/config/mmc-local.conf"
    server_cmd: >
      vllm serve /mnt/share/weights/glm-5.1-w8a8
      --host 0.0.0.0
      --port $SERVER_PORT
      --data-parallel-size ${DP_SIZE}
      --data-parallel-rank ${DP_RANK}
      --data-parallel-address ${DP_ADDRESS}
      --data-parallel-rpc-port ${DP_RPC_PORT}
      --tensor-parallel-size ${TP_SIZE}
      --enable-expert-parallel
      --speculative-config '{"num_speculative_tokens": 3, "method":"deepseek_mtp", "enforce_eager":true}'
      --seed 1024
      --max-model-len 131072
      --max-num-batched-tokens 512
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY", "cudagraph_capture_sizes":[4, 8, 12, 16, 20, 24, 28, 32, 64, 96, 128, 192, 256, 384, 512]}'
      --additional-config '{"enable_npugraph_ex": true, "fuse_muls_add":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable": true}'
      --trust-remote-code
      --max-num-seqs 128
      --gpu-memory-utilization 0.90
      --async-scheduling
      --quantization ascend
      --enable-auto-tool-choice
      --tool-call-parser glm47
      --reasoning-parser glm45
      --kv-transfer-config '{"kv_connector": "MultiConnector", "kv_role": "kv_consumer", "kv_load_failure_policy": "recompute", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30200", "kv_connector_extra_config": {"prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16, "pp_layer_partition": "41,37"}, "decode": {"dp_size": 8, "tp_size": 4}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"backend": "memcache"}}, {"kv_connector": "RecomputeCPUOffloadConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"cpu_bytes_to_use_per_rank": 17179869184, "enable_offload_prefix_caching": false}}]}}'
  - envs:
      <<: *env_common
      HCCL_BUFFSIZE: "900"
      TASK_QUEUE_ENABLE: "1"
      VLLM_ASCEND_ENABLE_MLAPO: "1"
      MMC_LOCAL_CONFIG_PATH: "/home/x00953824/glm-memcache_d/config/mmc-local.conf"
    server_cmd: >
      vllm serve /mnt/share/weights/glm-5.1-w8a8
      --host 0.0.0.0
      --port $SERVER_PORT
      --data-parallel-size ${DP_SIZE}
      --data-parallel-rank ${DP_RANK}
      --data-parallel-address ${DP_ADDRESS}
      --data-parallel-rpc-port ${DP_RPC_PORT}
      --tensor-parallel-size ${TP_SIZE}
      --enable-expert-parallel
      --speculative-config '{"num_speculative_tokens": 3, "method":"deepseek_mtp", "enforce_eager":true}'
      --seed 1024
      --max-model-len 131072
      --max-num-batched-tokens 512
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY", "cudagraph_capture_sizes":[4, 8, 12, 16, 20, 24, 28, 32, 64, 96, 128, 192, 256, 384, 512]}'
      --additional-config '{"enable_npugraph_ex": true, "fuse_muls_add":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable": true}'
      --trust-remote-code
      --max-num-seqs 128
      --gpu-memory-utilization 0.90
      --async-scheduling
      --quantization ascend
      --enable-auto-tool-choice
      --tool-call-parser glm47
      --reasoning-parser glm45
      --kv-transfer-config '{"kv_connector": "MultiConnector", "kv_role": "kv_consumer", "kv_load_failure_policy": "recompute", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30200", "kv_connector_extra_config": {"prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16, "pp_layer_partition": "41,37"}, "decode": {"dp_size": 8, "tp_size": 4}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"backend": "memcache"}}, {"kv_connector": "RecomputeCPUOffloadConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"cpu_bytes_to_use_per_rank": 17179869184, "enable_offload_prefix_caching": false}}]}}'

benchmarks:
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs400
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 64
    max_out_len: 1500
    batch_size: 16
    request_rate: 0
    baseline: 1
    threshold: 0.97
