# Memcache配置HBM+DRAM+本地SSD的三层分级KV Cache缓存架构，验证增加SSD后的性能提升
test_cases:
  - name: "DeepSeek-V3.1-Memcache-SSD-perf"
    model: "/weights/DeepSeek-V3.1-w8a8-mtp-QuaRot"
    envs:
      HCCL_OP_EXPANSION_MODE: "AIV"
      VLLM_ASCEND_BALANCE_SCHEDULING: "1"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      PYTHONHASHSEED: "0"
      MMC_LOCAL_CONFIG_PATH: "/{INSTALL_PATH}/memcache_hybrid/config/mmc-local.conf"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--data-parallel-size"
      - "4"
      - "--tensor-parallel-size"
      - "4"
      - "--quantization"
      - "ascend"
      - "--seed"
      - "1024"
      - "--enable-expert-parallel"
      - "--max-num-seqs"
      - "16"
      - "--max-model-len"
      - "16384"
      - "--max-num-batched-tokens"
      - "4096"
      - "--trust-remote-code"
      - "--no-enable-prefix-caching"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--speculative-config"
      - '{"num_speculative_tokens": 3, "method": "mtp"}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--port"
      - "$SERVER_PORT"
      - "--kv-transfer-config"
      - '{"kv_connector": "AscendStoreConnector", "kv_role": "kv_both", "kv_connector_extra_config": {"backend": "memcache"}}'
    benchmarks:
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs400
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 64
        max_out_len: 1500
        batch_size: 16
        request_rate: 0
        baseline: 1
        threshold: 0.97
