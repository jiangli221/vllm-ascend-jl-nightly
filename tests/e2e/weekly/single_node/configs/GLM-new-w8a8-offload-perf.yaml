# offload功能验证 - GLM性能测试
test_cases:
  - name: "GLM-new-w8a8-offload-perf"
    model: "/mnt/share/weights/GLM-new-w8a8"
    envs:
      HCCL_OP_EXPANSION_MODE: "AIV"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      HCCL_BUFFSIZE: "200"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      VLLM_ASCEND_BALANCE_SCHEDULING: "1"
      VLLM_ASCEND_ENABLE_MLAPO: "1"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--data-parallel-size"
      - "2"
      - "--tensor-parallel-size"
      - "8"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--port"
      - "$SERVER_PORT"
      - "--max-num-seqs"
      - "48"
      - "--max-model-len"
      - "33792"
      - "--max-num-batched-tokens"
      - "4096"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--quantization"
      - "ascend"
      - "--enable-chunked-prefill"
      - "--async-scheduling"
      - "--additional-config"
      - '{"enable_npugraph_ex": true, "fuse_muls_add":true, "multistream_overlap_shared_expert":true}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"num_speculative_tokens": 3, "method": "deepseek_mtp"}'
      - "--offload-backend"
      - "prefetch"
      - "--offload-group-size"
      - "8"
      - "--offload-num-in-group"
      - "4"
    benchmarks:
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs400
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 64
        max_out_len: 1500
        batch_size: 16
        request_rate: 0
        baseline: 1
        threshold: 0.97
